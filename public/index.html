<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Долгописатель</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,980px)}.card{background:#fff;border:1px solid #e4e8f0;border-radius:24px;padding:28px;box-shadow:0 14px 40px #18223a12}h1{margin:0 0 8px;font-size:clamp(28px,5vw,46px)}h2{margin:0 0 10px}p{color:#647086}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:24px}button,input,textarea{width:100%;border-radius:14px;padding:15px 16px;font:inherit}button{border:0;cursor:pointer;background:#172033;color:#fff;font-weight:700}button.secondary{background:#e9edf5;color:#172033}button.vip{background:#6d28d9}input,textarea{border:1px solid #d8deea;outline:none}.reader{min-height:430px;display:flex;flex-direction:column}.book{flex:1;display:grid;place-items:center;padding:30px 10px;text-align:center}.book h2{font-size:clamp(30px,5vw,54px);margin:0 0 18px}.book p{max-width:700px;font-size:clamp(18px,2.2vw,24px);line-height:1.65}.word{font-size:clamp(52px,12vw,120px);font-weight:900;letter-spacing:2px;overflow-wrap:anywhere}.status{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;color:#68748a}.remote{display:grid;gap:14px}.remote .big{font-size:22px;padding:22px}.pair{max-width:520px;margin:auto}.code{font-size:42px;letter-spacing:8px;font-weight:900;text-align:center;margin:18px 0}.hidden{display:none!important}.wordBox{display:grid;grid-template-columns:1fr auto;gap:10px}.wordBox button{width:auto;white-space:nowrap}.demoWords{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.demoWords button{background:#eef2f8;color:#172033}.hint{font-size:13px;margin:0}.vipBox{margin-top:18px;padding:18px;border-radius:18px;background:#f3edff;border:1px solid #dfccff}.vipGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.vipImage{width:100%;border-radius:16px;margin-top:12px;display:block}.price{font-size:24px;font-weight:900}@media(max-width:650px){.grid,.vipGrid{grid-template-columns:1fr}.card{padding:20px;border-radius:18px}.wordBox{grid-template-columns:1fr}.wordBox button{width:100%}.demoWords{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main class="app">
<section id="home" class="card pair"><h1>📖 Долгописатель</h1><p>Ноутбук показывает книгу, телефон управляет страницами.</p><div class="grid"><button onclick="createSession()">💻 Я на ноутбуке</button><button class="secondary" onclick="showJoin()">📱 Я на телефоне</button></div><div id="joinBox" class="hidden" style="margin-top:16px"><input id="codeInput" maxlength="4" placeholder="КОД СЕССИИ" autocomplete="off"><button style="margin-top:10px" onclick="joinSession()">Подключиться</button></div></section>

<section id="reader" class="card reader hidden"><div class="status"><span>Код: <b id="readerCode" class="code"></b></span><span id="readerPresence">Ожидание телефона…</span></div><div class="book"><div><div id="word" class="word"></div><h2 id="title"></h2><p id="text"></p><img id="readerImage" class="vipImage hidden" alt="Картинка для слова"></div></div><div class="status"><span id="pageLabel"></span><span id="pauseLabel"></span></div></section>

<section id="remote" class="card remote hidden"><div class="status"><span>📱 Пульт родителя</span><span id="remotePresence"></span></div><div>Сессия <b id="remoteCode"></b></div>
<div class="wordBox"><input id="wordInput" maxlength="100" placeholder="Напиши слово для ребёнка"><button onclick="sendWord()">Показать</button></div>
<p class="hint">Демо-слова:</p><div class="demoWords"><button onclick="sendDemo('КОТ')">🐱 КОТ</button><button onclick="sendDemo('ДОМ')">🏠 ДОМ</button><button onclick="sendDemo('ДЕРЕВО')">🌳 ДЕРЕВО</button><button onclick="sendDemo('СОЛНЦЕ')">☀️ СОЛНЦЕ</button><button onclick="sendDemo('КНИГА')">📖 КНИГА</button><button onclick="sendDemo('МАМА')">❤️ МАМА</button></div>
<button class="secondary" onclick="clearWord()">✕ Убрать слово</button><button class="big" onclick="control('prev')">◀ Назад</button><button class="big" onclick="control('next')">Вперёд ▶</button><button class="secondary" onclick="control('pause')">⏯ Пауза / продолжить</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><input id="pageInput" type="number" min="1" placeholder="Страница"><button onclick="goPage()">Перейти</button></div>

<div class="vipBox"><h2>✨ Долгописатель VIP</h2><p>VIP открывает генерацию картинок для слов прямо в приложении.</p><div class="price">Цена задаётся в Stripe</div><button class="vip" onclick="buyVip()">Купить VIP</button><div id="vipPanel" class="hidden" style="margin-top:14px"><textarea id="imagePrompt" rows="3" placeholder="Например: добрый мультяшный кот для детской книги"></textarea><button class="vip" style="margin-top:8px" onclick="generateImage()">🎨 Сгенерировать картинку</button><img id="remoteImage" class="vipImage hidden" alt="Сгенерированная картинка"></div><p id="vipStatus" class="hint"></p></div>
</section>
</main>
<script>
const pages=[['Глава 1','Это демонстрационная книга. Открой эту страницу на ноутбуке, а управление попробуй с телефона.'],['Глава 2','Нажми «Вперёд» на телефоне — страница на ноутбуке изменится практически мгновенно.'],['Глава 3','Кнопка паузы позволяет остановить чтение, а «Назад» возвращает предыдущую страницу.'],['Глава 4','Сюда позже можно загрузить настоящий текст книги, PDF или собственный учебник.'],['Конец демо','Готово! Теперь можно добавить аккаунты, книги, таймер и нормальную базу данных.']];
let ws,role,state={page:0,paused:false,word:'',image:''},vipSession=localStorage.getItem('vip_session')||'';
function connect(){const proto=location.protocol==='https:'?'wss':'ws';ws=new WebSocket(`${proto}://${location.host}`);ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='joined'){state.page=m.page;state.paused=m.paused;state.word=m.word||'';if(role==='reader')document.getElementById('readerCode').textContent=m.code;render()}if(m.type==='state'){state.page=m.page;state.paused=m.paused;state.word=m.word||'';render()}if(m.type==='presence'){const t=`${m.count} устройство(а)`;document.getElementById('readerPresence').textContent=t;document.getElementById('remotePresence').textContent=t}if(m.type==='error')alert(m.message)}}}
function wsWait(fn){if(ws.readyState===WebSocket.OPEN)fn();else ws.addEventListener('open',fn,{once:true})}
function createSession(){role='reader';show('reader');connect();wsWait(()=>ws.send(JSON.stringify({type:'create',role})))}
function showJoin(){document.getElementById('joinBox').classList.remove('hidden');document.getElementById('codeInput').focus()}
function joinSession(){role='controller';const code=document.getElementById('codeInput').value.trim().toUpperCase();if(code.length!==4)return alert('Введи 4-значный код');show('remote');connect();wsWait(()=>ws.send(JSON.stringify({type:'join',role,code})))}
function control(action,value){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify({type:'control',action,value}))}
function sendWord(){const input=document.getElementById('wordInput');const word=input.value.trim();if(word)control('word',word)}
function sendDemo(word){document.getElementById('wordInput').value=word;control('word',word)}
function clearWord(){document.getElementById('wordInput').value='';control('word','')}
function goPage(){const n=Number(document.getElementById('pageInput').value);if(n>=1)control('page',n-1)}
function show(id){['home','reader','remote'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id))}
async function buyVip(){document.getElementById('vipStatus').textContent='Открываю оплату…';try{const r=await fetch('/api/create-checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();if(!r.ok)throw new Error(d.error);location.href=d.url}catch(e){document.getElementById('vipStatus').textContent=e.message}}
async function checkVip(){const id=new URLSearchParams(location.search).get('vip_session');if(id){localStorage.setItem('vip_session',id);vipSession=id;history.replaceState({},'',location.pathname)}if(!vipSession)return;const r=await fetch('/api/vip-status?session_id='+encodeURIComponent(vipSession));const d=await r.json();if(d.paid){document.getElementById('vipPanel').classList.remove('hidden');document.getElementById('vipStatus').textContent='✨ VIP активен'}else{document.getElementById('vipStatus').textContent='Оплата ещё не подтверждена.'}}
async function generateImage(){if(!vipSession)return;const prompt=document.getElementById('imagePrompt').value.trim();if(!prompt)return;const s=document.getElementById('vipStatus');s.textContent='🎨 Генерирую…';try{const r=await fetch('/api/generate-image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:vipSession,prompt})});const d=await r.json();if(!r.ok)throw new Error(d.error);document.getElementById('remoteImage').src=d.image;document.getElementById('remoteImage').classList.remove('hidden');s.textContent='Готово!'}catch(e){s.textContent=e.message}}
function render(){const page=pages[Math.min(state.page,pages.length-1)];if(role==='reader'){document.getElementById('word').textContent=state.word;document.getElementById('title').textContent=page[0];document.getElementById('text').textContent=page[1];document.getElementById('pageLabel').textContent=`Страница ${state.page+1} / ${pages.length}`;document.getElementById('pauseLabel').textContent=state.paused?'⏸ Пауза':'▶ Читаем'}if(role==='controller')document.getElementById('remoteCode').textContent=document.getElementById('codeInput').value.toUpperCase()}
checkVip();
</script></body></html>
